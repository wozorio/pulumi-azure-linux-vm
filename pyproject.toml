[project]
name = "pulumi-azure-linux-vm"
version = "0.1.0"
description = "Pulumi Python code for deploying a Linux VM with Ubuntu 22.04 LTS (Jammy Jellyfish) in Azure"
authors = [
    { name = "Wellington Ozorio", email = "wozorio@duck.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pulumi>=3.255.0",
    "pulumi-azure-native>=3.24.0",
    "pyright>=1.1.411",
]

[tool.uv]
managed = true
